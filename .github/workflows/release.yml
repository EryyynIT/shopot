name: release

# Артефакты релиза: тег v* → сборка, пакет, файлы на странице Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Package
        run: |
          mkdir -p pkg
          cp target/release/shopot-gui pkg/
          cp README.md README.ru.md LICENSE pkg/
          tar -czf "shopot-gui-${GITHUB_REF_NAME}-x86_64-linux-gnu.tar.gz" -C pkg .
          sha256sum shopot-gui-*.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            shopot-gui-*.tar.gz
            SHA256SUMS
          body: |
            Первый релиз клиента: знакомство по одноразовому коду с QR,
            переписка с честными статусами доставки, блокировка контактов.

            Демон собирается отдельно из [shopot-core](https://github.com/Puxxalwl/shopot-core)
            (Zig 0.17.0) — путь сборки и запуск в README внутри архива.
